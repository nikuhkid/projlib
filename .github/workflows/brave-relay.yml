name: Build experimental Brave relay helper

on:
  push:
    branches: [experiment/brave-wasm]
    paths:
      - 'experimental/brave-vm/relay/native/**'
      - '.github/workflows/brave-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experimental/brave-vm/relay/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: experimental/brave-vm/relay/native/go.mod
          cache: false
      - name: Resolve and verify dependencies
        run: go mod tidy && go mod verify
      - name: Check the helper
        run: go vet ./... && go test ./...
      - name: Compile candidate helpers
        run: |
          candidate="$GITHUB_WORKSPACE/.local/brave-relay-candidate"
          vendor="$GITHUB_WORKSPACE/.local/brave-relay-vendor"
          mkdir -p "$candidate"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o "$candidate/ProjLibBraveRelay.exe" .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$candidate/projlib-brave-relay" .
          cp go.mod go.sum "$candidate/"
          go version > "$candidate/compiler.txt"
          go list -m -json all > "$candidate/dependencies.json"
          go mod vendor -o "$vendor"
          tar -czf "$candidate/dependency-source.tar.gz" -C "$vendor" .
          find "$candidate" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$candidate/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: brave-relay-helper-candidate
          path: .local/brave-relay-candidate/
          if-no-files-found: error
          retention-days: 7
