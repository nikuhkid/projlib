name: Verify native Brave rendering control

on:
  push:
    branches: [experiment/brave-wasm]
    paths:
      - '.github/workflows/brave-native-control.yml'
      - 'experimental/brave-vm/run-native-control.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the same pinned official Brave guest
        run: docker build --platform linux/amd64 --tag projlib-brave-native:control experimental/brave-vm/guest
      - name: Render the same controlled HTML with the browser sandbox enabled
        run: node experimental/brave-vm/run-native-control.mjs
      - name: Check the interpreter-only comparison with native Sync
        run: PROJLIB_NATIVE_JITLESS=1 node experimental/brave-vm/run-native-control.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brave-native-render-control
          path: native-control*.txt
          if-no-files-found: ignore
          retention-days: 7
