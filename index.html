<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ProjLib: a themed website directory and public web-proxy console." />
  <title>ProjLib Control Node [BETA]</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="console-container">

    <!-- HEADER -->
    <header class="header">
      <h1 class="title">ProjLib Control Node [BETA]</h1>
      <div class="header-row">
        <div class="header-left">
          <label class="switch">
            <input type="checkbox" id="proxyToggle" data-needs-config disabled />
            <span class="slider"></span>
            <span class="label">Proxy Mode</span>
          </label>
        </div>
        <div class="header-right">
          <button id="scannerBtn" type="button" aria-controls="proxyForm" aria-expanded="true"><i class="ri-search-eye-line" aria-hidden="true"></i> Scanner</button>
          <button id="themeBtn" type="button" disabled><i class="ri-paint-brush-line" aria-hidden="true"></i> Theme</button>
        </div>
      </div>
    </header>

    <!-- Address bar -->
    <form id="proxyForm" class="scanner">
      <label class="sr-only" for="urlInput">Website address</label>
      <input type="text" id="urlInput" placeholder="Enter a website address, e.g. example.com" autocomplete="url" autocapitalize="none" spellcheck="false" required />
      <button type="submit" data-needs-config disabled>Engage</button>
    </form>

    <!-- Dropdown selectors -->
    <div class="dropdowns-grid">
      <div class="select-container"><i class="ri-brain-line"></i><select id="brain"></select></div>
      <div class="select-container"><i class="ri-gamepad-line"></i><select id="play"></select></div>
      <div class="select-container"><i class="ri-movie-line"></i><select id="anime"></select></div>
      <div class="select-container"><i class="ri-book-open-line"></i><select id="read"></select></div>
      <div class="select-container"><i class="ri-video-line"></i><select id="watch"></select></div>
      <div class="select-container"><i class="ri-calendar-line"></i><select id="daily"></select></div>
    </div>

    <!-- Action buttons -->
    <div class="action-buttons">
      <button id="homeBtn" type="button" data-needs-config disabled><i class="ri-home-2-line" aria-hidden="true"></i> Home</button>
      <button id="refreshBtn" type="button" data-needs-config disabled><i class="ri-restart-line" aria-hidden="true"></i> Refresh</button>
      <button id="fullscreenBtn" type="button"><i class="ri-fullscreen-line" aria-hidden="true"></i> Fullscreen</button>
      <a id="openOriginal" target="_blank" rel="noopener noreferrer" hidden>Open original ↗</a>
    </div>



    <p id="statusMessage" role="status" aria-live="polite">Loading the site directory…</p>
    <p id="connectionNote" class="connection-note">Proxy Mode routes pages through the ProjLib proxy. Some sites, sign-ins, and video players may require Open original.</p>

    <!-- Proxy iframe area -->
    <div id="proxyContainer">
      <div id="initialMessage" class="idle-state">
        <div>
          <i class="ri-global-line"></i>
          <h3>System Idle</h3>
          <p>Awaiting input sequence.</p>
        </div>
      </div>
      <div id="loadingOverlay" class="loadingOverlay" hidden><div class="spinner" role="status" aria-label="Opening site"></div></div>
      <iframe id="proxyFrame" title="Website viewer" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads" referrerpolicy="no-referrer" allow="fullscreen" hidden></iframe>
      <div id="browserView" class="browser-view" hidden>
        <div class="browser-tools" aria-label="Private browser controls">
          <button type="button" data-browser-action="back" aria-label="Back">←</button>
          <button type="button" data-browser-action="forward" aria-label="Forward">→</button>
          <div id="browserTabs" class="browser-tabs" aria-label="Browser tabs"></div>
          <button type="button" data-browser-action="newTab" aria-label="New tab">+</button>
          <button type="button" data-browser-action="keyboard">Keyboard</button>
          <select id="streamQuality" aria-label="Stream quality"><option value="responsive">Responsive</option><option value="sharp">Sharper</option></select>
          <button type="button" data-browser-action="end">End session</button>
        </div>
        <div id="browserStage" class="browser-stage">
          <canvas id="browserCanvas" width="1280" height="800" tabindex="0" aria-label="Remote website. Click to interact; use Keyboard for text on phones."></canvas>
          <textarea id="browserKeyboard" class="browser-keyboard" aria-label="Type into the remote website" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" data-lpignore="true"></textarea>
        </div>
      </div>
    </div>

  </div>

  <noscript><p>ProjLib needs JavaScript to load its directory and website viewer.</p></noscript>
  <script src="js/core.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/browser-session.js?v=2" defer></script>
  <script src="js/apps.js" defer></script>
</body>
</html>
