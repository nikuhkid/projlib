<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ProjLib Brave execution probe</title>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <style>[hidden]{display:none!important}body{margin:20px;background:#101522;color:#e6edf6;font:15px system-ui}button{font:inherit;padding:8px 14px}#terminal{margin-top:16px;height:75vh}#status{min-height:2em}</style>
</head>
<body>
  <h1>Brave execution probe</h1>
  <p>This checks the real Brave binary inside a local WebAssembly Linux guest. It is not a ready browsing session.</p>
  <section id="host-verification" hidden>
    <form id="host-form">
      <label for="host-password">Wolfie host password</label>
      <input id="host-password" type="password" autocomplete="current-password" minlength="8" maxlength="256" required>
      <button id="verify-host" type="submit">Verify host</button>
      <button id="disconnect-host" type="button" disabled>Disconnect</button>
    </form>
    <p id="host-status" role="status">Checking Wolfie…</p>
    <p>Verification lasts 12 hours. Your Brave profile stays on this device.</p>
  </section>
  <button id="start">Start isolated guest</button>
  <button id="save-profile" hidden disabled>Save profile on this device</button>
  <button id="close-profile" hidden disabled>Save and close Brave</button>
  <p id="status" role="status">Waiting to start.</p>
  <form id="browser-tools" hidden style="display:flex;gap:6px;max-width:1024px;flex-wrap:wrap">
    <button id="browser-back" type="button" aria-label="Back">←</button>
    <button id="browser-forward" type="button" aria-label="Forward">→</button>
    <button id="browser-reload" type="button">Reload</button>
    <input id="browser-address" aria-label="Address" placeholder="Enter a website address" style="flex:1;min-width:200px;font:inherit">
    <button type="submit">Go</button>
    <button id="browser-sync" type="button">Brave Sync</button>
    <button id="browser-shields" type="button">Shields</button>
  </form>
  <div id="terminal"></div>
  <div id="desktop" hidden style="width:100%;height:800px;background:black"></div>
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/pty/index.js"></script>
  <script type="module" src="/probe.mjs"></script>
</body>
</html>
